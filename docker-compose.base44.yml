services:
  db:
    image: mysql:8.0
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: gofire
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pdevroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - dbdata:/var/lib/mysql
  web:
    image: node:20
    restart: on-failure
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    ports: ["3000:3000"]
    env_file:
      - /run/base44/app.env
    environment:
      - DATABASE_URL=mysql://root:devroot@db:3306/gofire
      - NEXTAUTH_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_PUBLIC_APP_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    command: ["sh","-ec","npm ci --legacy-peer-deps && npx prisma db push --skip-generate && npx prisma generate && (npm run db:seed || true) && exec npx next dev -H 0.0.0.0 -p 3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:3000/ || (echo web failed; exit 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
volumes:
  dbdata:
  node_modules:
  next_cache:
